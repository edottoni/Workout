<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <title>Cronograma de Treino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only injects the analytics script when both values are actually configured
      // (e.g. via Codemagic env vars at build time). Avoids a pointless network
      // request to "/umami" in builds - like the packaged Android app - where
      // these are left unset.
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        var isPlaceholder = function (v) {
          return !v || v.indexOf("%VITE_") === 0;
        };
        if (isPlaceholder(endpoint) || isPlaceholder(websiteId)) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
