// DO NOT EDIT THIS FILE BY HAND.
// It is (re)generated automatically by `npx cap sync android` / `npx cap update android`,
// based on the Capacitor plugins listed in the project's package.json.
// The content below is a snapshot matching the plugins declared at scaffold time so the
// project is Gradle-evaluable even before the first `cap sync` is run.

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-app')
    implementation project(':capacitor-keyboard')
    implementation project(':capacitor-splash-screen')
    implementation project(':capacitor-status-bar')

}

if (hasProperty('postBuildExtras')) {
    postBuildExtras()
}
