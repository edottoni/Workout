apply plugin: 'com.android.application'

android {
    namespace "com.workoutscheduler.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.workoutscheduler.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode / versionName come from android/gradle.properties so they are
        // easy to bump in one place. Override at the CLI with -PversionCode=X if needed.
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate
             // large numbers of source map files.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // Release signing is optional and only activated when the keystore + credentials
        // are supplied (e.g. via Codemagic env vars / -P properties in CI). Without them,
        // `assembleRelease` produces an UNSIGNED apk, which is expected for local testing.
        release {
            def storeFilePath = project.hasProperty('android.injected.signing.store.file')
                ? project.property('android.injected.signing.store.file') : System.getenv("CM_KEYSTORE_PATH")
            def storePasswordVal = project.hasProperty('android.injected.signing.store.password')
                ? project.property('android.injected.signing.store.password') : System.getenv("CM_KEYSTORE_PASSWORD")
            def keyAliasVal = project.hasProperty('android.injected.signing.key.alias')
                ? project.property('android.injected.signing.key.alias') : System.getenv("CM_KEY_ALIAS")
            def keyPasswordVal = project.hasProperty('android.injected.signing.key.password')
                ? project.property('android.injected.signing.key.password') : System.getenv("CM_KEY_PASSWORD")

            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword storePasswordVal
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds are always signed with the auto-generated debug keystore.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = project.hasProperty('android.injected.signing.store.file')
                ? project.property('android.injected.signing.store.file') : System.getenv("CM_KEYSTORE_PATH")
            if (storeFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// `npx cap sync android` appends the following line automatically (idempotent):
apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
