# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m

# Use AndroidX package structure (required by Capacitor).
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX.
android.enableJetifier=true

# Enable Gradle's build cache / parallel builds for faster CI runs.
org.gradle.parallel=true
org.gradle.caching=true

# App version, referenced from android/app/build.gradle.
# Bump versionCode on every release; versionName is the user-facing string.
versionCode=1
versionName=1.0.0
