workflows:
  android-debug:
    name: Workout Scheduler - Android Debug APK
    max_build_duration: 60
    environment:
      node: 20.19.0
      java: 21
      groups: []
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install pnpm
        script: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        script: |
          pnpm install --no-frozen-lockfile
      - name: Type-check (non-blocking report)
        script: |
          pnpm check || echo "TypeScript reported issues above - review before release."
      - name: Build web assets (Vite)
        script: |
          pnpm build:web
      - name: Capacitor sync (copies web build + native plugins into android/)
        script: |
          npx cap sync android
      - name: Ensure Gradle wrapper is present
        script: |
          cd android
          if [ ! -f ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type all
          fi
          chmod +x ./gradlew
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.aab

  android-release:
    name: Workout Scheduler - Android Release (APK + AAB)
    max_build_duration: 60
    environment:
      node: 20.19.0
      java: 21
      # Configure a Codemagic "Android signing" secure file group named
      # `android_signing` containing the keystore, then reference the
      # secrets below via Codemagic environment variable groups. Do NOT
      # commit a keystore or its passwords to the repository.
      groups:
        - android_signing # expects: CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD,
                           #          CM_KEY_ALIAS, CM_KEY_PASSWORD
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*.*.*"
          include: true
    scripts:
      - name: Install pnpm
        script: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        script: |
          pnpm install --no-frozen-lockfile
      - name: Build web assets (Vite)
        script: |
          pnpm build:web
      - name: Capacitor sync
        script: |
          npx cap sync android
      - name: Ensure Gradle wrapper is present
        script: |
          cd android
          if [ ! -f ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type all
          fi
          chmod +x ./gradlew
      - name: Build signed release APK + AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
